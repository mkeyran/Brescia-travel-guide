name: Tests

# The site is served by GitHub Pages straight from the branch, including the
# committed data/ folder (regenerate it with `node scripts/locate.mjs`).
# This workflow only checks the guide and the code.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Committed data matches the guide
        run: node scripts/check-data.mjs
