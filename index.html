<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A hand-picked walking guide to Brescia: quiet sights, food shops and markets, and walks — every pick linked to its sources">
    <meta name="theme-color" content="#2f5d50">
    <title>Brescia on Foot</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <h1 class="logo">Brescia on Foot</h1>
        <input type="search" id="search" placeholder="Search name or type…" aria-label="Search the guide" autocomplete="off">
        <button class="icon-btn" id="aboutBtn" aria-label="About and food guide">ⓘ</button>
    </header>

    <nav class="chips" id="chips" aria-label="Filter categories">
        <button class="chip" data-cat="walks" aria-pressed="true">🚶 Walks</button>
        <button class="chip" data-cat="food" aria-pressed="true">🧀 Eat &amp; buy</button>
        <button class="chip" data-cat="heritage" aria-pressed="true">🏛️ See</button>
        <button class="chip" data-cat="nature" aria-pressed="true">🌄 Outdoors</button>
        <button class="chip extra" data-cat="trails" aria-pressed="false">🥾 CAI trails</button>
        <button class="chip extra" data-cat="essentials" aria-pressed="false">🚰 Water &amp; WC</button>
    </nav>

    <main id="map" aria-label="Map"></main>

    <div class="fabs">
        <button class="fab" id="walkBtn" aria-label="My walk">🚶<span class="badge" id="walkCount" hidden>0</span></button>
        <button class="fab" id="locateBtn" aria-label="Show my location" data-state="off">◎</button>
    </div>

    <section class="panel" id="panel" data-expanded="false">
        <button class="panel-handle" id="panelHandle" aria-label="Expand or collapse list">
            <span class="grip"></span>
            <span id="panelTitle">Loading…</span>
        </button>
        <div class="panel-body" id="panelBody"></div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/markercluster/leaflet.markercluster.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
